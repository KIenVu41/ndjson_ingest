name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dart:
    name: Dart SDK (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.10.0', '3.13.4']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - run: dart pub get

      - name: Check formatting
        if: matrix.sdk == '3.13.4'
        run: dart format --output=none --set-exit-if-changed lib test tool example

      - run: dart analyze
      - run: dart test --reporter expanded

      - name: Validate release archive
        if: matrix.sdk == '3.13.4'
        run: dart pub publish --dry-run

      - name: Run the resume example
        if: matrix.sdk == '3.13.4'
        run: dart run example/ndjson_ingest_example.dart

  macos:
    name: macOS Dart SDK (3.13.4)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.4'

      - run: dart pub get
      - run: dart analyze
      - run: dart test --reporter expanded
      - run: dart run example/ndjson_ingest_example.dart

  android:
    name: Android Flutter (3.47.5)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: bash tool/check_mobile.sh android emulator-5554

  ios:
    name: iOS Flutter (3.47.5)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - name: Test on an available iPhone simulator and build unsigned release
        run: |
          device=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          trap 'xcrun simctl shutdown "$device"' EXIT
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          bash tool/check_mobile.sh ios "$device"
